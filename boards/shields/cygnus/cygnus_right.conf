CONFIG_ZMK_POINTING=y

# Experimental BLE connection management for improved stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Sleep disabled on the right half (2026-09-15) to test whether the random
# disconnects are failed wakes from deep sleep. Plugging into USB recovered it,
# and VBUS is a system-off wake source, which points at the wake path.
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
